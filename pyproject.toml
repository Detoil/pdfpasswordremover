[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-unlock"
version = "1.0.0"
description = "Command line tool that removes password protection from PDF files."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pikepdf>=8"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pdf-unlock = "pdf_unlock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
